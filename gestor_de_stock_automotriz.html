    <style>
        /* Estilos para simular comportamiento de App Nativa en móviles y centrar en desktops */
        body {
            background-color: #0F172A;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* Scrollbars elegantes */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Contenedor móvil para pantallas grandes */
        .mobile-frame {
            max-width: 440px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        @media(max-width: 440px) {
            .mobile-frame {
                max-width: 100%;
                height: 100dvh;
                box-shadow: none;
            }
        }
        /* Transiciones fluidas */
        .page-transition {
            transition: all 0.25s ease-out;
        }
        /* Efecto de pulso turquesa suave */
        .pulse-teal {
            animation: pulseTeal 2s infinite;
        }
        @keyframes pulseTeal {
            0% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(13, 148, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0); }
        }
    </style>
</head>

    ];

    function App() {
        // App Core State
        const [stock, setStock] = useState(INITIAL_STOCK_DATA);
        const [auctions, setAuctions] = useState(INITIAL_AUCTIONS);
        const [customers, setCustomers] = useState(INITIAL_CUSTOMERS);
        
        // Navigation: 'inicio', 'stock', 'subastas', 'clientes'
        const [activeTab, setActiveTab] = useState('inicio');
        
        // Modal States
        const [activeCar, setActiveCar] = useState(null); // Detailed view
        const [isFilterSheetOpen, setIsFilterSheetOpen] = useState(false);
        const [isPriceSheetOpen, setIsPriceSheetOpen] = useState(false);
        const [isStatusSheetOpen, setIsStatusSheetOpen] = useState(false);
        const [isAuctionBidSheetOpen, setIsAuctionBidSheetOpen] = useState(false);
        const [activeAuction, setActiveAuction] = useState(null);

        // Filter stock variables
        const [searchQuery, setSearchQuery] = useState("");
        const [filterState, setFilterState] = useState("Todos"); // State chips
        const [filters, setFilters] = useState({
            marca: "",
            anio: "",
            precioMax: 20000000,
            estado: ""
        });

        // Price adjustments variables
        const [adjustedPrice, setAdjustedPrice] = useState(0);

        // Status change variables
        const [selectedStatus, setSelectedStatus] = useState("");
        const [statusNote, setStatusNote] = useState("");

        // Auction Bid state
        const [bidAmount, setBidAmount] = useState(0);

        // Subastas inner tabs: 'disponibles', 'ofertas', 'adjudicadas'
        const [subastaTab, setSubastaTab] = useState('disponibles');

        // Clientes inner tabs: 'clientes', 'intereses'
        const [clienteTab, setClienteTab] = useState('clientes');
        const [isNewClientSheetOpen, setIsNewClientSheetOpen] = useState(false);
        const [newClient, setNewClient] = useState({ nombre: "", telefono: "", tipo: "Particular", interes: "" });

        // Cargar Auto step-by-step state
        const [isCargarAutoOpen, setIsCargarAutoOpen] = useState(false);
        const [cargarStep, setCargarStep] = useState(1);
        const [wizardData, setWizardData] = useState({
            id: null,
            patente: "",
            marca: "",
            modelo: "",
            version: "1.5 Full",
            anio: 2020,
            km: 50000,
            color: "Gris",
            transmision: "Manual",
            combustible: "Bencina",
            origen: "Nacional",
            precioVenta: 9000000,
            costoAdquisicion: 7000000,
            estado: "En preparación",
            diasStock: 1,
            fotos: [
                "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=600&q=80"
            ],
            comentario: "",
            desdeSubastaId: null
        });

        // Notification system
        const [notification, setNotification] = useState(null);

        const showNotification = (message, type = "success") => {
            setNotification({ message, type });
            setTimeout(() => {
                setNotification(null);
            }, 3500);
        };

        const kpis = useMemo(() => {
            const activos = stock.filter(c => c.estado !== "Vendido");
            const vendidosMes = stock.filter(c => c.estado === "Vendido");
            
            const valorStock = activos.reduce((sum, c) => sum + c.costoAdquisicion, 0);
            const promedioDias = activos.length > 0 
                ? Math.round(activos.reduce((sum, c) => sum + c.diasStock, 0) / activos.length) 
                : 0;
            const tieneCriticos = activos.some(c => c.diasStock > 60);

            // Margen promedio de los activos y vendidos
            const margenPromedio = activos.length > 0
                ? Math.round((activos.reduce((sum, c) => sum + (c.precioVenta - c.costoAdquisicion), 0) / activos.length))
                : 0;

            const totalMontoVendidos = vendidosMes.reduce((sum, c) => sum + c.precioVenta, 0);
            const adjudicadasPendientes = auctions.filter(a => a.estado === "Adjudicada").length;

            return {
                valorStock,
                promedioDias,
                tieneCriticos,
                margenPromedio,
                cantVendidos: vendidosMes.length,
                montoVendidos: totalMontoVendidos,
                adjudicadasPendientes
            };
        }, [stock, auctions]);

        // Formatear pesos chilenos
        const fmtCLP = (num) => {
            return new Intl.NumberFormat('es-CL', {
                style: 'currency',
                currency: 'CLP',
                minimumFractionDigits: 0
            }).format(num);
        };

        const filteredStock = useMemo(() => {
            return stock.filter(car => {
                const query = searchQuery.toLowerCase();
                const matchesSearch = car.marca.toLowerCase().includes(query) || 
                                      car.modelo.toLowerCase().includes(query) || 
                                      car.patente.toLowerCase().includes(query);
                
                const matchesChip = filterState === "Todos" || car.estado === filterState;

                const matchesMarca = !filters.marca || car.marca === filters.marca;
                const matchesAnio = !filters.anio || car.anio.toString() === filters.anio;
                const matchesPrecio = car.precioVenta <= filters.precioMax;
                const matchesEstado = !filters.estado || car.estado === filters.estado;

                return matchesSearch && matchesChip && matchesMarca && matchesAnio && matchesPrecio && matchesEstado;
            });
        }, [stock, searchQuery, filterState, filters]);

        // Listado de marcas únicas en stock para filtros
        const marcasDisponibles = useMemo(() => {
            return [...new Set(stock.map(c => c.marca))];
        }, [stock]);

        // Workflow 1: Iniciar carga manual
        const handleAbrirCargaManual = () => {
            setWizardData({
                id: null,
                patente: "",
                marca: "",
                modelo: "",
                version: "1.5 GL Mecánico",
                anio: 2021,
                km: 42000,
                color: "Gris Metálico",
                transmision: "Manual",
                combustible: "Bencina",
                origen: "Nacional",
                precioVenta: 8990000,
                costoAdquisicion: 7100000,
                estado: "En preparación",
                diasStock: 1,
                fotos: [
                    "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=600&q=80"
                ],
                comentario: "Ingresado manualmente por el patio.",
                desdeSubastaId: null
            });
            setCargarStep(1);
            setIsCargarAutoOpen(true);
        };

        // Workflow 2: Agregar desde subasta adjudicada
        const handleAgregarDesdeSubasta = (auction) => {
            setWizardData({
                id: null,
                patente: auction.patente || "POR-ASIG",
                marca: auction.marca,
                modelo: auction.modelo,
                version: auction.version || "1.4 Hatchback",
                anio: auction.anio,
                km: auction.km || 40000,
                color: auction.color || "Gris",
                transmision: auction.transmision || "Manual",
                combustible: auction.combustible || "Bencina",
                origen: "Remate / Subasta",
                precioVenta: auction.sugeridoVenta,
                costoAdquisicion: auction.costoFinal,
                estado: "Pre-stock",
                diasStock: 1,
                fotos: [
                    "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=600&q=80"
                ],
                comentario: `Procedente de ${auction.origen}.`,
                desdeSubastaId: auction.id
            });
            setCargarStep(1);
            setIsCargarAutoOpen(true);
        };

        // Guardar Auto del Wizard
        const handleGuardarAutoWizard = () => {
            const nuevoAuto = {
                ...wizardData,
                id: wizardData.id || stock.length + 1,
                patente: wizardData.patente.toUpperCase() || "SIN-PAT",
                precioVenta: Number(wizardData.precioVenta),
                costoAdquisicion: Number(wizardData.costoAdquisicion)
            };

            // Añadir al stock
            setStock([nuevoAuto, ...stock]);

            // Si venía de subasta, eliminar o cambiar estado de la subasta para no duplicar
            if (wizardData.desdeSubastaId) {
                setAuctions(auctions.filter(a => a.id !== wizardData.desdeSubastaId));
                showNotification(`¡Excelente! Subasta ganada de ${nuevoAuto.marca} ${nuevoAuto.modelo} traspasada a Stock.`, "success");
            } else {
                showNotification(`¡Auto ${nuevoAuto.marca} ${nuevoAuto.modelo} agregado al stock con éxito!`, "success");
            }

            // Cerrar wizard y volver a Stock
            setIsCargarAutoOpen(false);
            setActiveTab('stock');
        };

        // Guardar cambio de precio
        const handleGuardarPrecio = () => {
            if (!activeCar) return;
            setStock(stock.map(c => {
                if (c.id === activeCar.id) {
                    const actualizado = { ...c, precioVenta: adjustedPrice };
                    setActiveCar(actualizado);
                    return actualizado;
                }
                return c;
            }));
            setIsPriceSheetOpen(false);
            showNotification("Precio del auto actualizado correctamente.");
        };

        // Guardar cambio de estado
        const handleGuardarEstado = () => {
            if (!activeCar) return;
            setStock(stock.map(c => {
                if (c.id === activeCar.id) {
                    const actualizado = { ...c, estado: selectedStatus, comentario: statusNote || c.comentario };
                    setActiveCar(actualizado);
                    return actualizado;
                }
                return c;
            }));
            setIsStatusSheetOpen(false);
            showNotification(`Estado cambiado a "${selectedStatus}"`);
        };

        // Ofertar en Subasta
        const handleEnviarOfertaSubasta = () => {
            if (!activeAuction) return;
            setAuctions(auctions.map(a => {
                if (a.id === activeAuction.id) {
                    return {
                        ...a,
                        estado: "Mis Ofertas",
                        miOferta: bidAmount
                    };
                }
                return a;
            }));
            setIsAuctionBidSheetOpen(false);
            showNotification(`¡Oferta de ${fmtCLP(bidAmount)} enviada con éxito!`);
        };

        // Crear Cliente
        const handleCrearCliente = () => {
            if (!newClient.nombre) return;
            const client = {
                id: customers.length + 1,
                nombre: newClient.nombre,
                telefono: newClient.telefono || "+56 9 XXXX XXXX",
                tipo: newClient.tipo,
                estado: "Nuevo",
                interes: newClient.interes || "Ninguno",
                reservadoId: null
            };
            setCustomers([...customers, client]);
            setIsNewClientSheetOpen(false);
            setNewClient({ nombre: "", telefono: "", tipo: "Particular", interes: "" });
            showNotification("Cliente registrado con éxito.");
        };

        return (
            <div className="mobile-frame font-sans">
                
                {/* NOTIFICACIONES EMERGENTES */}
                {notification && (
                    <div className="absolute top-4 left-4 right-4 z-50 bg-teal-800 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-teal-500 animate-bounce">
                        <i className="fa-solid fa-circle-check text-xl text-teal-300"></i>
                        <span className="text-sm font-semibold">{notification.message}</span>
                    </div>
                )}

                {/* HEADER PRINCIPAL */}
                <header className="bg-chileanNavy text-white px-4 py-4 flex justify-between items-center shrink-0 border-b border-slate-800">
                    <div className="flex items-center gap-2">
                        <div className="bg-chileanTeal p-2 rounded-lg">
                            <i className="fa-solid fa-car-rear text-white"></i>
                        </div>
                        <div>
                            <h1 className="font-extrabold text-base tracking-tight">SuraMotor</h1>
                            <p className="text-[10px] text-slate-400 font-medium">COMPRAVENTA USADOS • CHILE</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-3">
                        <span className="bg-slate-800 text-teal-400 font-bold px-2.5 py-1 rounded-full text-xs flex items-center gap-1.5 border border-slate-700">
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                            Santiago
                        </span>
                    </div>
                </header>

                {/* PANTALLA PRINCIPAL: CONTENIDO SCROLLABLE */}
                <main className="flex-1 overflow-y-auto bg-chileanBg pb-24 hide-scrollbar">

                    {}
                    {activeTab === 'inicio' && (
                        <div className="p-4 space-y-5 animate-fade-in">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h2 className="text-xl font-bold text-slate-800">¡Hola, Alfredo! 👋</h2>
                                    <p className="text-xs text-slate-500">¿Qué auto ingresará al patio hoy?</p>
                                </div>
                                <span className="text-xs text-slate-400 font-semibold bg-slate-100 px-2 py-1 rounded">Hoy, 12 de Julio</span>
                            </div>

                            {/* ALERTA DE STOCK CRÍTICO >60 DÍAS */}
                            {kpis.tieneCriticos && (
                                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex gap-3 items-start shadow-sm">
                                    <div className="bg-amber-100 text-amber-700 p-2.5 rounded-xl">
                                        <i className="fa-solid fa-triangle-exclamation text-lg"></i>
                                    </div>
                                    <div className="flex-1">
                                        <h4 className="text-sm font-bold text-amber-800">Alerta de Rotación</h4>
                                        <p className="text-xs text-amber-700 mt-0.5">Tienes autos con más de 60 días en stock (ej. Toyota Yaris). Considera ajustar precios.</p>
                                    </div>
                                </div>
                            )}

                            {/* SECCIÓN DE ACCESO RÁPIDO */}
                            <div className="bg-gradient-to-r from-teal-900 to-chileanNavy rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                                <div className="absolute right-0 bottom-0 opacity-10 text-[100px] font-black pointer-events-none transform translate-y-6">
                                    CL

                    </div>
                )}


                {/* HOJA DESDE ABAJO: FILTROS */}
                {isFilterSheetOpen && (
                    <div className="absolute inset-0 bg-black/60 z-50 flex flex-col justify-end">
                        <div className="bg-white rounded-t-3xl max-h-[85%] flex flex-col animate-slide-up">
                            <div className="p-4 flex justify-between items-center border-b border-slate-100 shrink-0">
                                <h3 className="font-extrabold text-sm text-slate-800">Filtrar Vehículos</h3>
                                <button onClick={() => setIsFilterSheetOpen(false)} className="text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-circle-xmark text-lg"></i>
                                </button>
                            </div>

                            <div className="p-4 overflow-y-auto space-y-4">
                                {/* Filtro Marca */}
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Marca</label>
                                    <select 
                                        value={filters.marca}
                                        onChange={(e) => setFilters({...filters, marca: e.target.value})}
                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 bg-white"
                                    >
                                        <option value="">Todas las marcas</option>
                                        {marcasDisponibles.map(m => (
                                            <option key={m} value={m}>{m}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* Filtro Año */}
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Año</label>
                                    <input 
                                        type="number" 
                                        placeholder="Ej: 2021"
                                        value={filters.anio}
                                        onChange={(e) => setFilters({...filters, anio: e.target.value})}
                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700"
                                    />
                                </div>

                                {/* Filtro Rango Precio Máximo */}
                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider">Precio Máximo</label>
                                        <span className="text-xs font-extrabold text-chileanTeal">{fmtCLP(filters.precioMax)}</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="4000000" 
                                        max="20000000" 
                                        step="500000"
                                        value={filters.precioMax}
                                        onChange={(e) => setFilters({...filters, precioMax: parseInt(e.target.value)})}
                                        className="w-full accent-chileanTeal"
                                    />
                                </div>
                            </div>

                            <div className="p-4 border-t border-slate-100 flex gap-2 shrink-0">
                                <button 
                                    onClick={() => {
                                        setFilters({ marca: "", anio: "", precioMax: 20000000, estado: "" });
                                        setIsFilterSheetOpen(false);
                                    }}
                                    className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs"
                                >
                                    Limpiar
                                </button>
                                <button 
                                    onClick={() => setIsFilterSheetOpen(false)}
                                    className="flex-1 py-3 bg-chileanTeal text-white font-bold rounded-xl text-xs"
                                >
                                    Aplicar Filtros
                                </button>
                            </div>
                        </div>
                    </div>
                )}


                {/* HOJA DESDE ABAJO: AJUSTAR PRECIO */}
                {isPriceSheetOpen && activeCar && (
                    <div className="absolute inset-0 bg-black/60 z-50 flex flex-col justify-end">
                        <div className="bg-white rounded-t-3xl p-4 space-y-4 animate-slide-up">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h3 className="font-bold text-sm text-slate-800">Ajustar Precio de Venta</h3>
                                    <p className="text-xs text-slate-500">{activeCar.marca} {activeCar.modelo}</p>
                                </div>
                                <button onClick={() => setIsPriceSheetOpen(false)} className="text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-circle-xmark text-lg"></i>
                                </button>
                            </div>

                            {/* Mostrar Valor de Precio Gigante */}
                            <div className="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                                <span className="text-[10px] text-slate-400 font-bold uppercase block">Nuevo Precio</span>
                                <span className="text-2xl font-black text-slate-800">{fmtCLP(adjustedPrice)}</span>
                            </div>

                            {/* Control gordo para ajustar con pulgar */}
                            <div className="flex justify-between items-center gap-3">
                                <button 
                                    onClick={() => setAdjustedPrice(Math.max(adjustedPrice - 100000, activeCar.costoAdquisicion))}
                                    className="w-14 h-14 bg-slate-100 hover:bg-slate-200 active:scale-90 rounded-full flex items-center justify-center text-slate-800 text-xl font-black transition-all"
                                >
                                    <i className="fa-solid fa-minus"></i>
                                </button>
                                <div className="flex-1 text-center">
                                    <span className="text-[10px] text-emerald-600 font-bold uppercase block">Nuevo Margen Estimado</span>
                                    <span className="text-base font-extrabold text-emerald-600">
                                        +{fmtCLP(adjustedPrice - activeCar.costoAdquisicion)}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => setAdjustedPrice(adjustedPrice + 100000)}
                                    className="w-14 h-14 bg-slate-100 hover:bg-slate-200 active:scale-90 rounded-full flex items-center justify-center text-slate-800 text-xl font-black transition-all"
                                >
                                    <i className="fa-solid fa-plus"></i>
                                </button>
                            </div>

                            <button 
                                onClick={handleGuardarPrecio}
                                className="w-full py-3.5 bg-chileanTeal hover:bg-chileanTealDark text-white font-extrabold rounded-xl text-xs shadow-md transition-all active:scale-95"
                            >
                                Guardar Precio de Venta
                            </button>
                        </div>
                    </div>
                )}


                {/* HOJA DESDE ABAJO: CAMBIAR ESTADO */}
                {isStatusSheetOpen && activeCar && (
                    <div className="absolute inset-0 bg-black/60 z-50 flex flex-col justify-end">
                        <div className="bg-white rounded-t-3xl p-4 space-y-4 animate-slide-up">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h3 className="font-bold text-sm text-slate-800">Cambiar Estado de Operación</h3>
                                    <p className="text-xs text-slate-500">{activeCar.marca} {activeCar.modelo}</p>
                                </div>
                                <button onClick={() => setIsStatusSheetOpen(false)} className="text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-circle-xmark text-lg"></i>
                                </button>
                            </div>

                            <div className="space-y-3">
                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Seleccionar Estado</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {["Pre-stock", "En preparación", "En venta", "Reservado", "Vendido"].map(est => {
                                        const isSelected = selectedStatus === est;
                                        return (
                                            <button
                                                key={est}
                                                type="button"
                                                onClick={() => setSelectedStatus(est)}
                                                className={`py-2 px-3 rounded-xl font-bold text-xs border text-left flex justify-between items-center transition-all ${
                                                    isSelected 
                                                        ? 'bg-chileanNavy text-white border-chileanNavy' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200'
                                                }`}
                                            >
                                                {est}
                                                {isSelected && <i className="fa-solid fa-circle-check text-teal-400"></i>}
                                            </button>
                                        );
                                    })}
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Nota Opcional</label>
                                    <textarea 
                                        placeholder="Ej: Se inicia proceso de detallado estético..."
                                        value={statusNote}
                                        onChange={(e) => setStatusNote(e.target.value)}
                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-chileanTeal"
                                        rows="2"
                                    ></textarea>
                                </div>
                            </div>

                            <button 
                                onClick={handleGuardarEstado}
                                className="w-full py-3.5 bg-chileanTeal hover:bg-chileanTealDark text-white font-extrabold rounded-xl text-xs shadow-md transition-all active:scale-95"
                            >
                                Cambiar Estado
                            </button>
                        </div>
                    </div>
                )}


                {/* HOJA DESDE ABAJO: OFERTAR SUBASTA */}
                {isAuctionBidSheetOpen && activeAuction && (
                    <div className="absolute inset-0 bg-black/60 z-50 flex flex-col justify-end">
                        <div className="bg-white rounded-t-3xl p-4 space-y-4 animate-slide-up">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h3 className="font-bold text-sm text-slate-800">Ingresar Oferta en Remate</h3>
                                    <p className="text-xs text-slate-500">{activeAuction.marca} {activeAuction.modelo} ({activeAuction.origen})</p>
                                </div>
                                <button onClick={() => setIsAuctionBidSheetOpen(false)} className="text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-circle-xmark text-lg"></i>
                                </button>
                            </div>

                            <div className="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                                <span className="text-[10px] text-slate-400 font-bold uppercase block">Monto de tu Oferta</span>
                                <span className="text-2xl font-black text-slate-800">{fmtCLP(bidAmount)}</span>
                            </div>

                            <div className="flex justify-between items-center gap-3">
                                <button 
                                    onClick={() => setBidAmount(Math.max(bidAmount - 100000, activeAuction.ultimaOferta))}
                                    className="w-14 h-14 bg-slate-100 hover:bg-slate-200 active:scale-90 rounded-full flex items-center justify-center text-slate-800 text-xl font-black transition-all"
                                >
                                    <i className="fa-solid fa-minus"></i>
                                </button>
                                <div className="flex-1 text-center text-xs font-semibold text-slate-500">
                                    Oferta Mínima Requerida: {fmtCLP(activeAuction.ultimaOferta + 100000)}
                                </div>
                                <button 
                                    onClick={() => setBidAmount(bidAmount + 100000)}
                                    className="w-14 h-14 bg-slate-100 hover:bg-slate-200 active:scale-90 rounded-full flex items-center justify-center text-slate-800 text-xl font-black transition-all"
                                >
                                    <i className="fa-solid fa-plus"></i>
                                </button>
                            </div>

                            <button 
                                onClick={handleEnviarOfertaSubasta}
                                className="w-full py-3.5 bg-chileanTeal hover:bg-chileanTealDark text-white font-extrabold rounded-xl text-xs shadow-md transition-all active:scale-95"
                            >
                                Enviar Oferta Oficial
                            </button>
                        </div>
                    </div>
                )}


                {/* HOJA DESDE ABAJO: NUEVO CLIENTE */}
                {isNewClientSheetOpen && (
                    <div className="absolute inset-0 bg-black/60 z-50 flex flex-col justify-end">
                        <div className="bg-white rounded-t-3xl p-4 space-y-4 animate-slide-up">
                            <div className="flex justify-between items-center">
                                <h3 className="font-bold text-sm text-slate-800">Registrar Nuevo Lead / Cliente</h3>
                                <button onClick={() => setIsNewClientSheetOpen(false)} className="text-slate-400 hover:text-slate-600">
                                    <i className="fa-solid fa-circle-xmark text-lg"></i>
                                </button>
                            </div>

                            <div className="space-y-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Nombre Completo</label>
                                    <input 
                                        type="text" 
                                        placeholder="Ej: Marcelo Aravena"
                                        value={newClient.nombre}
                                        onChange={(e) => setNewClient({...newClient, nombre: e.target.value})}
                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Teléfono o Celular</label>
                                    <input 
                                        type="text" 
                                        placeholder="Ej: +56 9 1234 5678"
                                        value={newClient.telefono}
                                        onChange={(e) => setNewClient({...newClient, telefono: e.target.value})}
                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700"
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Tipo de Cliente</label>
                                        <select 
                                            value={newClient.tipo}
                                            onChange={(e) => setNewClient({...newClient, tipo: e.target.value})}
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 bg-white"
                                        >
                                            <option value="Particular">Particular</option>
                                            <option value="Empresa">Empresa / Dealer</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Auto de Interés</label>
                                        <input 
                                            type="text" 
                                            placeholder="Ej: Kia Morning"
                                            value={newClient.interes}
                                            onChange={(e) => setNewClient({...newClient, interes: e.target.value})}
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700"
                                        />
                                    </div>
                                </div>
                            </div>

                            <button 
                                onClick={handleCrearCliente}
                                className="w-full py-3.5 bg-chileanTeal hover:bg-chileanTealDark text-white font-extrabold rounded-xl text-xs shadow-md transition-all active:scale-95"
                            >
                                Registrar Cliente
                            </button>
                        </div>
                    </div>
                )}

            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('app'));
</script>
</body>
</html>
